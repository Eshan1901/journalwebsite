name: Deploy React App to MilesWeb

on:
  push:
    branches:
      - master   # change if your branch is main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 3️⃣ Install dependencies
      - name: Install Dependencies
        run: npm install

      # 4️⃣ Build React project
      - name: Build Project
        run: npm run build

      # 5️⃣ Deploy build folder to MilesWeb via FTP
      - name: Deploy to MilesWeb
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_KEY }}
          local-dir: build/
          server-dir: public_html/
